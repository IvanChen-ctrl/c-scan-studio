name: Publish verified v3.6.0 beta source
# This workflow does not modify the independent v3.3.1 stable release.
# A release is only permitted when the exact main commit has both CI and
# CodeQL successes, and main has not moved before publication.
on:
  workflow_run:
    workflows: ['CI tests', 'CodeQL']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: cscan-v3.6.0-beta.3-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository_visibility == 'public' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      RELEASE_DIR: /tmp/cscan-v360b3-release
      EXPECTED_TAG: v3.6.0-beta.3
    steps:
      - name: Require CI and CodeQL success for EXACT main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$EXPECTED_TAG" >/dev/null 2>&1; then
            echo 'Already published. Preserving the immutable existing release.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$EVENT_SHA" ]]; then
            echo "Main advanced after this workflow trigger ($head versus $EVENT_SHA). Skipping."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EVENT_SHA&per_page=100" > "$RUNNER_TEMP/validations.json"
          ci=$(jq -r --arg sha "$EVENT_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .name=="CI tests" and .conclusion=="success")] | length' "$RUNNER_TEMP/validations.json")
          codeql=$(jq -r --arg sha "$EVENT_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .name=="CodeQL" and .conclusion=="success")] | length' "$RUNNER_TEMP/validations.json")
          if [[ "$ci" -lt 1 || "$codeql" -lt 1 ]]; then
            echo "Waiting for successful CI and CodeQL for $EVENT_SHA (CI=$ci CodeQL=$codeql)."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Re-run all regression suites
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for suite in tests tests_v3 tests_v31 tests_v32 tests_v33 tests_v34 tests_v35 tests_v352 tests_v36 tests_v362 tests_v363; do
            python -m unittest discover -s "$suite"
          done
      - name: Re-run UI behavior regression before beta publication
        if: steps.gate.outputs.ready == 'true'
        run: node tests_v362/browser_behavior.cjs
      - name: Build deterministic source-only beta ZIP OUTSIDE repo
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: python scripts/build_release.py --outdir "$RELEASE_DIR"
      - name: Check full source integrity manifest
        if: steps.gate.outputs.ready == 'true'
        run: python Security_Audit.py
      - name: Confirm main did not advance before publishing
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_SHA: ${{ steps.gate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$PINNED_SHA" ]]; then
            echo "Main changed; refusing to attach artifacts to another source commit."
            exit 1
          fi
          (cd "$RELEASE_DIR" && sha256sum -c C_Scan_Studio_v3.6.0-beta.3_Source.zip.sha256.txt)
      - name: Create GitHub build attestation
        if: steps.gate.outputs.ready == 'true'
        uses: actions/attest@v4
        with:
          subject-path: /tmp/cscan-v360b3-release/C_Scan_Studio_v3.6.0-beta.3_Source.zip
      - name: Publish separate beta release with its OWN SHA-256
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$EXPECTED_TAG" >/dev/null 2>&1; then
            echo 'This exact beta release already exists; not overwriting.'
            exit 0
          fi
          gh release create "$EXPECTED_TAG" \
            "$RELEASE_DIR/C_Scan_Studio_v3.6.0-beta.3_Source.zip" \
            "$RELEASE_DIR/C_Scan_Studio_v3.6.0-beta.3_Source.zip.sha256.txt" \
            --prerelease \
            --title 'C-Scan Studio v3.6 beta 3 - Stress-Hardened Multi-Drive Classification' \
            --notes-file docs/RELEASE_NOTES_v3.6.0-beta.3.md
