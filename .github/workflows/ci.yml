name: CI tests
# Windows GitHub runners may default to cp1252 even when the source is UTF-8.
env:
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Source and safety regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Regression tests
        shell: bash
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s tests_v3
          python -m unittest discover -s tests_v31
          python -m unittest discover -s tests_v32
          python -m unittest discover -s tests_v33
          python -m unittest discover -s tests_v34
          python -m unittest discover -s tests_v35
          python -m unittest discover -s tests_v352
          python -m unittest discover -s tests_v36
          python -m unittest discover -s tests_v362
      - name: Execute browser interaction regressions (mocked local APIs)
        run: node tests_v362/browser_behavior.cjs
      - name: Build and check source-only release
        shell: bash
        run: |
          python scripts/build_release.py --outdir ../out
          python Security_Audit.py
          python -c "import zipfile,pathlib; p=pathlib.Path('../out/C_Scan_Studio_v3.6.0-beta.2_Source.zip'); z=zipfile.ZipFile(p); assert z.testzip() is None; assert not any(x.lower().endswith(('.exe','.dll','.msi','.whl')) for x in z.namelist());print('Source-only ZIP verified')"
