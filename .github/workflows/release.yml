name: Release pinned v3.3.1 source + provenance
# Pin source to the exact already-scanned, CI-validated commit.
# Changes to the release workflow must not change the v3.3.1 ZIP digest.
on:
  workflow_run:
    workflows: ['CI tests', 'CodeQL']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: publish-verified-v3.3.1
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository_visibility == 'public' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      RELEASE_SOURCE_SHA: '2f58ca3415b46a4f87915211cf970671a5d1c09a'
      EXPECTED_ZIP_SHA256: 'd6f1adeb0befd9603244aada81882dbaa64ffc120010020afa7e39dc99865362'
      RELEASE_DIR: /tmp/cscan-dist
    steps:
      - name: Gate on real CI and CodeQL for workflow and scanned source commits
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.3.1 >/dev/null 2>&1; then
            echo 'v3.3.1 already exists; preserving its files.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for sha in "$EVENT_SHA" "$RELEASE_SOURCE_SHA"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" > "$RUNNER_TEMP/checks-$sha.json"
            ci=$(jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha==$sha and .name=="CI tests" and .conclusion=="success")] | length' "$RUNNER_TEMP/checks-$sha.json")
            codeql=$(jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha==$sha and .name=="CodeQL" and .conclusion=="success")] | length' "$RUNNER_TEMP/checks-$sha.json")
            if [[ "$ci" -lt 1 || "$codeql" -lt 1 ]]; then
              echo "Not publishing; checks incomplete for $sha (CI=$ci CodeQL=$codeql)"
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "Verified source $RELEASE_SOURCE_SHA and triggering commit $EVENT_SHA"
      - name: Checkout exact source used for VirusTotal-scanned archive
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          persist-credentials: false
      - name: Install Python
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Repeat source tests
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for suite in tests tests_v3 tests_v31 tests_v32 tests_v33; do
            python -m unittest discover -s "$suite"
          done
      - name: Build outside the source tree
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: python scripts/build_release.py --outdir "$RELEASE_DIR"
      - name: Require exact SHA-256 from existing VirusTotal report
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_ZIP_SHA256  $RELEASE_DIR/C_Scan_Studio_v3.3.1_Source.zip" | sha256sum --check -
      - name: Verify included source manifest
        if: steps.gate.outputs.ready == 'true'
        run: python Security_Audit.py
      - name: Generate GitHub artifact attestation
        if: steps.gate.outputs.ready == 'true'
        uses: actions/attest@v4
        with:
          subject-path: /tmp/cscan-dist/C_Scan_Studio_v3.3.1_Source.zip
      - name: Publish immutable v3.3.1 GitHub release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.3.1 >/dev/null 2>&1; then
            echo 'Existing v3.3.1 release will not be replaced.'
            exit 0
          fi
          cp docs/RELEASE_NOTES_v3.3.md "$RUNNER_TEMP/cscan_release_notes.md"
          cat >> "$RUNNER_TEMP/cscan_release_notes.md" <<'EOF'

          ## Published-file security evidence (2026-10-31)

          - Source commit (verified CI + CodeQL): `2f58ca3415b46a4f87915211cf970671a5d1c09a`
          - ZIP SHA-256: `d6f1adeb0befd9603244aada81882dbaa64ffc120010020afa7e39dc99865362`
          - User-submitted VirusTotal file report: https://www.virustotal.com/gui/file/d6f1adeb0befd9603244aada81882dbaa64ffc120010020afa7e39dc99865362/detection
          - VirusTotal engine detection count/verdict has not been independently retrieved from the dynamic report.
          - GitHub attestation binds this build run to the ZIP digest. Source was pinned despite later workflow-only fixes.
          - Git tag identifies the repository's default branch at publication; the archive itself was built from the independently CI-verified source commit noted above.
          EOF
          gh release create v3.3.1 \
            "$RELEASE_DIR/C_Scan_Studio_v3.3.1_Source.zip" \
            "$RELEASE_DIR/C_Scan_Studio_v3.3.1_Source.zip.sha256.txt" \
            --title 'C-Scan Studio v3.3.1 - verified source release' \
            --notes-file "$RUNNER_TEMP/cscan_release_notes.md"
